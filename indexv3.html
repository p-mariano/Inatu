<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manual WhatsApp · Inatú</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Averia+Libre:ital,wght@0,400;0,700;1,400&family=EB+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
  <style>
    /* =========================================================
       PALETA OFICIAL INATÚ — Brandbook 2026
       ========================================================= */
    :root {
      --folha:    #2B471E;
      --arbusto:  #55893A;
      --broto:    #B3CD38;
      --terra:    #522810;
      --bosque:   #CE6621;
      --polpa:    #FF9B2F;
      --marfim:   #FFF9EB;
      --casca:    #1E1E1E;

      --cp:       var(--arbusto);
      --cd:       var(--folha);
      --cl:       #EFE6CE;
      --cl-soft:  #F6EDD5;
      --bg:       var(--marfim);
      --tx:       var(--casca);
      --gy:       #6B6358;
      --bd:       #E5DCC4;
      --wh:       #ffffff;

      --sw: 268px;
      --r: 14px;
      --rs: 10px;
      --sh: 0 1px 4px rgba(43,71,30,.08), 0 4px 18px rgba(43,71,30,.06);

      --f-serif: 'EB Garamond', Georgia, 'Times New Roman', serif;
      --f-msg:   'Averia Libre', 'EB Garamond', Georgia, serif;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--f-serif);
      background: var(--bg);
      color: var(--tx);
      font-size: 17px;
      line-height: 1.55;
      font-feature-settings: "kern", "liga";
      -webkit-font-smoothing: antialiased;
    }

    /* ── Layout ── */
    .app { display: flex; min-height: 100vh; }

    /* Sidebar */
    .sidebar {
      width: var(--sw); background: var(--folha); color: var(--marfim);
      display: flex; flex-direction: column;
      position: fixed; top: 0; left: 0; height: 100vh;
      overflow-y: auto; z-index: 200;
      transition: transform .3s cubic-bezier(.4,0,.2,1);
      border-right: 1px solid rgba(0,0,0,.1);
    }
    .sb-head {
      padding: 26px 22px 18px;
      border-bottom: 1px solid rgba(255,249,235,.12);
    }
    .brand {
      color: var(--marfim);
      line-height: 0;
    }
    .brand svg {
      width: 100%;
      max-width: 175px;
      height: auto;
      display: block;
      fill: currentColor;
    }
    .brand-sub {
      font-family: var(--f-serif);
      font-style: italic;
      font-size: 13px;
      color: rgba(255,249,235,.6);
      margin-top: 10px;
      letter-spacing: .2px;
      line-height: 1.2;
    }

    .sb-nav { flex: 1; padding: 14px 0; }
    .nav-lbl {
      font-family: var(--f-serif);
      font-style: italic;
      font-size: 12px;
      color: rgba(255,249,235,.45);
      padding: 16px 22px 6px;
      letter-spacing: .3px;
    }
    .nav-div { height: 1px; background: rgba(255,249,235,.1); margin: 8px 14px; }
    .nav-btn {
      display: flex; align-items: center; gap: 12px;
      width: 100%; padding: 8px 22px;
      background: none; border: none;
      color: rgba(255,249,235,.78); font-family: var(--f-serif);
      font-size: 15.5px;
      text-align: left; cursor: pointer; transition: all .18s; line-height: 1.3;
    }
    .nav-btn:hover { background: rgba(255,249,235,.07); color: var(--marfim); }
    .nav-btn.active {
      background: var(--arbusto); color: var(--marfim);
      font-weight: 600;
    }
    .nav-num {
      min-width: 26px; height: 24px;
      padding: 0 6px;
      background: rgba(255,249,235,.15); color: var(--marfim);
      border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      font-size: 12.5px; font-weight: 600; flex-shrink: 0;
      font-family: var(--f-serif);
      letter-spacing: -.2px;
    }
    .nav-btn.active .nav-num { background: rgba(255,249,235,.28); }
    .nav-ico { font-size: 16px; flex-shrink: 0; width: 26px; text-align: center; }
    .sb-foot {
      padding: 16px 22px;
      border-top: 1px solid rgba(255,249,235,.1);
      font-size: 12px; color: rgba(255,249,235,.4);
      font-style: italic;
    }

    /* Main */
    .main { margin-left: var(--sw); flex: 1; min-height: 100vh; }
    .mob-bar {
      display: none; align-items: center; gap: 14px;
      padding: 14px 18px; background: var(--folha); color: var(--marfim);
      position: sticky; top: 0; z-index: 100;
    }
    .hamburger { background: none; border: none; color: var(--marfim); font-size: 24px; cursor: pointer; padding: 2px; line-height: 1; }
    .mob-brand { color: var(--marfim); line-height: 0; }
    .mob-brand svg { height: 28px; width: auto; fill: currentColor; display: block; }
    .overlay { display: none; position: fixed; inset: 0; background: rgba(43,71,30,.55); z-index: 190; }

    /* ── Stages ── */
    .stage { display: none; padding: 42px 44px; max-width: 800px; }
    .stage.active { display: block; }
    .stage-hd { margin-bottom: 26px; }
    .stage-title {
      font-family: var(--f-serif);
      font-size: 32px; font-weight: 600;
      color: var(--folha);
      display: flex; align-items: baseline; gap: 12px;
      letter-spacing: -.3px;
      flex-wrap: wrap;
    }
    .stage-num {
      color: var(--arbusto);
      font-style: italic;
      font-weight: 400;
      font-size: 26px;
    }
    .stage-ico { font-size: 26px; }
    .stage-desc {
      font-size: 16px;
      color: var(--gy);
      margin-top: 8px;
      line-height: 1.55;
      font-style: italic;
      max-width: 640px;
    }

    .var-hint {
      display: inline-flex; align-items: center; gap: 8px;
      background: var(--cl-soft);
      border: 1px solid var(--bd);
      border-left: 3px solid var(--polpa);
      border-radius: 4px;
      padding: 8px 14px; font-size: 14px;
      color: var(--terra);
      margin-bottom: 28px;
      font-style: italic;
    }

    /* ── Groups & Cards ── */
    .group { margin-bottom: 32px; }
    .grp-lbl {
      display: flex; align-items: center; gap: 12px;
      font-family: var(--f-serif);
      font-size: 14px; font-weight: 600;
      text-transform: uppercase; letter-spacing: 1.5px;
      color: var(--arbusto);
      margin-bottom: 14px;
    }
    .grp-lbl::after { content: ''; flex: 1; height: 1px; background: var(--bd); }

    .msg-card {
      background: var(--wh);
      border-radius: var(--r);
      box-shadow: var(--sh);
      overflow: hidden;
      margin-bottom: 12px;
      border: 1px solid var(--bd);
    }
    .chat-bg {
      padding: 16px 18px;
      background: var(--cl-soft);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .bubble {
      max-width: 85%;
      padding: 11px 15px;
      border-radius: 14px;
      font-size: 15px;
      line-height: 1.55;
      white-space: pre-wrap;
      word-break: break-word;
      position: relative;
      box-shadow: 0 1px 2px rgba(43,71,30,.12);
      font-family: var(--f-msg);
    }
    .bubble-out {
      background: var(--arbusto); color: var(--marfim);
      border-bottom-right-radius: 4px; margin-left: auto;
    }
    .bubble-in {
      background: var(--wh); color: var(--tx);
      border-bottom-left-radius: 4px;
      border: 1px solid var(--bd);
    }

    /* Editable variables */
    .var {
      background: var(--polpa);
      color: var(--terra);
      border-bottom: 2px dashed var(--bosque);
      border-radius: 3px;
      padding: 0 4px;
      cursor: text;
      outline: none;
      font-style: italic;
      display: inline;
      min-width: 12px;
      transition: background .15s;
      font-weight: 500;
    }
    .var:focus { background: #FFB95A; }

    .card-foot {
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 16px;
      border-top: 1px solid var(--cl);
      gap: 12px;
      background: var(--wh);
    }
    .card-note {
      font-size: 14px;
      color: var(--gy);
      font-style: italic;
      flex: 1;
      line-height: 1.45;
    }
    .card-note:empty { display: none; }

    .copy-btn {
      display: flex; align-items: center; gap: 6px;
      padding: 7px 16px;
      background: var(--folha); color: var(--marfim);
      border: none; border-radius: var(--rs);
      font-family: var(--f-serif);
      font-size: 14px; font-weight: 600;
      cursor: pointer;
      transition: all .15s;
      white-space: nowrap; flex-shrink: 0;
    }
    .copy-btn:hover { background: var(--arbusto); }
    .copy-btn:active { transform: scale(.97); }
    .copy-btn.ok { background: var(--arbusto); }

    /* ── Triggers ── */
    .trig-intro {
      font-size: 15px;
      color: var(--folha);
      margin-bottom: 20px;
      padding: 12px 16px;
      background: var(--cl);
      border-radius: var(--rs);
      border-left: 3px solid var(--arbusto);
      font-style: italic;
    }
    .trig-intro strong { font-style: normal; font-weight: 700; color: var(--folha); }

    .trig-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(155px, 1fr));
      gap: 12px;
      margin-bottom: 24px;
    }
    .trig-card {
      background: var(--wh);
      border: 2px solid var(--bd);
      border-radius: var(--r);
      padding: 16px 14px;
      cursor: pointer;
      transition: all .2s;
      box-shadow: var(--sh);
      text-align: left; width: 100%;
      font-family: var(--f-serif);
    }
    .trig-card:hover {
      border-color: var(--arbusto);
      transform: translateY(-2px);
      box-shadow: 0 6px 14px rgba(85,137,58,.18);
    }
    .trig-card.sel {
      border-color: var(--arbusto);
      background: var(--cl);
    }
    .tc-ico { font-size: 28px; margin-bottom: 8px; display: block; }
    .tc-title { font-size: 15px; font-weight: 600; color: var(--folha); }

    .trig-result {
      display: none;
      background: var(--wh);
      border-radius: var(--r);
      box-shadow: var(--sh);
      overflow: hidden;
      border: 1px solid var(--bd);
    }
    .trig-result.show { display: block; }
    .trig-when {
      padding: 14px 18px;
      background: var(--cl);
      border-bottom: 1px solid var(--bd);
      font-size: 15px;
      color: var(--folha);
      line-height: 1.5;
      font-style: italic;
    }
    .trig-when strong { font-style: normal; font-weight: 700; }

    /* ── Reactivation tabs ── */
    .react-tabs { display: flex; gap: 10px; margin-bottom: 22px; flex-wrap: wrap; }
    .react-tab {
      padding: 9px 22px;
      border-radius: 24px;
      border: 2px solid var(--arbusto);
      background: var(--wh);
      color: var(--arbusto);
      font-family: var(--f-serif);
      font-size: 15px; font-weight: 600;
      cursor: pointer; transition: all .15s;
    }
    .react-tab small { font-size: 13px; font-weight: 400; opacity: .8; font-style: italic; margin-left: 4px; }
    .react-tab.active { background: var(--arbusto); color: var(--marfim); }

    .react-panel { display: none; }
    .react-panel.active { display: block; }

    /* ── Rules ── */
    .rules-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; }
    .rule-item {
      background: var(--wh);
      border-left: 4px solid var(--arbusto);
      border-radius: 0 var(--rs) var(--rs) 0;
      padding: 14px 16px;
      box-shadow: var(--sh);
      font-size: 15px; line-height: 1.5;
      border-top: 1px solid var(--bd);
      border-right: 1px solid var(--bd);
      border-bottom: 1px solid var(--bd);
    }
    .rule-item strong { color: var(--folha); }

    /* ── Expansion ── */
    .exp-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; }
    .exp-item {
      background: var(--wh);
      border: 2px dashed var(--bd);
      border-radius: var(--r);
      padding: 20px 18px;
      color: var(--gy);
      font-size: 14.5px;
      line-height: 1.5;
    }
    .exp-item strong {
      display: block;
      color: var(--folha);
      font-weight: 600;
      margin-bottom: 4px;
      font-size: 17px;
      font-family: var(--f-serif);
    }
    .exp-badge {
      display: inline-block;
      font-family: var(--f-serif);
      font-style: italic;
      font-size: 12px;
      background: var(--cl);
      color: var(--bosque);
      padding: 3px 10px;
      border-radius: 12px;
      margin-bottom: 10px;
    }
    .exp-sub { font-size: 13px; color: var(--bosque); font-style: italic; margin-bottom: 6px; }

    /* ── Toast ── */
    .toast {
      position: fixed; bottom: 28px; left: 50%;
      transform: translateX(-50%) translateY(70px);
      background: var(--folha); color: var(--marfim);
      padding: 11px 24px; border-radius: 26px;
      font-family: var(--f-serif);
      font-size: 15px; font-weight: 600;
      z-index: 9999;
      transition: transform .3s cubic-bezier(.34,1.56,.64,1);
      pointer-events: none; white-space: nowrap;
      box-shadow: 0 8px 24px rgba(43,71,30,.3);
    }
    .toast.on { transform: translateX(-50%) translateY(0); }

    /* ── Calendário de frutas ── */
    .cal-view { display: none; }
    .cal-view.active { display: block; }

    .cal-intro {
      font-size: 15px;
      color: var(--folha);
      margin-bottom: 20px;
      padding: 12px 16px;
      background: var(--cl);
      border-radius: var(--rs);
      border-left: 3px solid var(--arbusto);
      font-style: italic;
    }

    .cal-grid {
      background: var(--wh);
      border: 1px solid var(--bd);
      border-radius: var(--r);
      box-shadow: var(--sh);
      overflow-x: auto;
      padding: 4px;
    }
    .cal-table {
      width: 100%;
      border-collapse: separate;
      border-spacing: 3px;
      min-width: 760px;
      font-family: var(--f-serif);
    }
    .cal-table th, .cal-table td {
      padding: 0;
      text-align: center;
      vertical-align: middle;
    }
    .cal-th-mes {
      font-size: 12px;
      font-weight: 600;
      color: var(--gy);
      letter-spacing: .5px;
      text-transform: uppercase;
      padding: 8px 0 10px !important;
    }
    .cal-th-mes.current {
      color: var(--folha);
    }
    .cal-th-mes.current::after {
      content: '';
      display: block;
      width: 18px;
      height: 2px;
      background: var(--arbusto);
      margin: 4px auto 0;
      border-radius: 2px;
    }
    .cal-th-fruta {
      text-align: left !important;
      padding: 10px 14px !important;
      font-size: 16px;
      font-weight: 600;
      color: var(--folha);
      cursor: pointer;
      border-radius: var(--rs);
      transition: background .15s;
      white-space: nowrap;
    }
    .cal-th-fruta:hover { background: var(--cl-soft); }
    .cal-th-fruta .cal-dot {
      display: inline-block;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      margin-right: 8px;
      vertical-align: middle;
    }

    .cal-cell {
      height: 34px;
      min-width: 48px;
      border-radius: 6px;
      cursor: pointer;
      transition: transform .12s, box-shadow .12s, outline-color .12s;
      outline: 2px solid transparent;
      outline-offset: -2px;
    }
    .cal-cell:hover {
      transform: scale(1.06);
      box-shadow: 0 2px 8px rgba(43,71,30,.18);
    }
    .cal-col-current .cal-cell {
      outline-color: rgba(85,137,58,.55);
    }
    .cal-cell-confirm {
      background: repeating-linear-gradient(45deg, #E5DCC4 0 6px, #F1E9D2 6px 12px);
    }

    .cal-legend {
      display: flex;
      flex-wrap: wrap;
      gap: 14px 22px;
      margin-top: 20px;
      padding: 14px 18px;
      background: var(--cl-soft);
      border-radius: var(--rs);
      font-size: 13.5px;
      color: var(--folha);
    }
    .cal-legend-item { display: flex; align-items: center; gap: 8px; }
    .cal-legend-swatch {
      width: 18px;
      height: 14px;
      border-radius: 4px;
      flex-shrink: 0;
      border: 1px solid rgba(0,0,0,.05);
    }

    /* Detalhe da fruta */
    .cal-detail-hd {
      display: flex;
      align-items: flex-start;
      gap: 18px;
      padding: 18px 22px;
      background: var(--wh);
      border: 1px solid var(--bd);
      border-left: 5px solid var(--arbusto);
      border-radius: var(--r);
      margin-bottom: 18px;
      box-shadow: var(--sh);
    }
    .cal-detail-bullet {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      flex-shrink: 0;
      margin-top: 4px;
    }
    .cal-detail-meta { flex: 1; }
    .cal-detail-meta h2 {
      font-family: var(--f-serif);
      font-size: 28px;
      font-weight: 600;
      color: var(--folha);
      margin-bottom: 6px;
      letter-spacing: -.2px;
    }
    .cal-detail-meta p {
      font-size: 15px;
      color: var(--gy);
      line-height: 1.5;
      font-style: italic;
    }

    .cal-back {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 16px;
      background: var(--wh);
      color: var(--folha);
      border: 1.5px solid var(--bd);
      border-radius: var(--rs);
      font-family: var(--f-serif);
      font-size: 14.5px;
      font-weight: 600;
      cursor: pointer;
      transition: all .15s;
      margin-bottom: 18px;
    }
    .cal-back:hover {
      border-color: var(--arbusto);
      color: var(--arbusto);
      background: var(--cl-soft);
    }

    .cal-frutas-tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 22px;
      flex-wrap: wrap;
    }
    .cal-frutas-tab {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 7px 16px;
      border-radius: 20px;
      border: 1.5px solid var(--bd);
      background: var(--wh);
      color: var(--gy);
      font-family: var(--f-serif);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all .15s;
    }
    .cal-frutas-tab:hover { border-color: var(--arbusto); color: var(--folha); }
    .cal-frutas-tab.active { background: var(--folha); color: var(--marfim); border-color: var(--folha); }
    .cal-frutas-tab .cal-dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }

    .cal-meses {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 12px;
    }
    .cal-mes-card {
      background: var(--wh);
      border: 1px solid var(--bd);
      border-radius: var(--r);
      padding: 14px 16px;
      box-shadow: var(--sh);
      position: relative;
      overflow: hidden;
    }
    .cal-mes-card.current {
      border-color: var(--arbusto);
      border-width: 2px;
      padding: 13px 15px;
    }
    .cal-mes-card .cal-status-bar {
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 4px;
    }
    .cal-mes-card.confirm .cal-status-bar {
      background: repeating-linear-gradient(45deg, #E5DCC4 0 6px, #F1E9D2 6px 12px);
    }
    .cal-mes-hd {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      margin: 4px 0 8px;
      gap: 10px;
    }
    .cal-mes-nome {
      font-family: var(--f-serif);
      font-size: 18px;
      font-weight: 600;
      color: var(--folha);
    }
    .cal-mes-nome .cur-tag {
      font-size: 11px;
      font-style: italic;
      font-weight: 400;
      color: var(--arbusto);
      margin-left: 6px;
      letter-spacing: .3px;
    }
    .cal-mes-label {
      font-size: 12.5px;
      font-weight: 600;
      letter-spacing: .3px;
      text-transform: uppercase;
      padding: 3px 9px;
      border-radius: 10px;
      white-space: nowrap;
    }
    .cal-mes-preco {
      font-size: 14px;
      color: var(--terra);
      font-weight: 600;
      margin-bottom: 6px;
    }
    .cal-mes-preco.muted { color: var(--gy); font-weight: 400; font-style: italic; }
    .cal-mes-nota {
      font-size: 13.5px;
      color: var(--gy);
      line-height: 1.5;
    }

    /* ── Focus states — acessibilidade por teclado ── */
    :focus-visible { outline: 2px solid var(--arbusto); outline-offset: 2px; }
    .nav-btn:focus-visible { outline: 2px solid var(--broto); outline-offset: -3px; border-radius: 6px; }

    /* ── Skip link ── */
    .skip-link {
      position: absolute; top: -100px; left: 16px;
      padding: 10px 18px; background: var(--folha); color: var(--marfim);
      border-radius: 0 0 var(--rs) var(--rs);
      font-family: var(--f-serif); font-size: 14px; font-weight: 600;
      z-index: 9999; transition: top .15s; text-decoration: none;
    }
    .skip-link:focus { top: 0; }

    /* ── Touch targets mínimos ── */
    .nav-btn { min-height: 44px; }
    .copy-btn { min-height: 40px; }

const CAL_STATUS_META = {
  pico:         { labelLegenda: "Safra / pico",      bg: f => f.cor,                                       color: '#fff' },
  inicio_safra: { labelLegenda: "Início / fim",      bg: f => f.cor + '80',                                color: '#000' },
  fim_safra:    { labelLegenda: "Início / fim",      bg: f => f.cor + '80',                                color: '#000' },
  plantio:      { labelLegenda: "Plantio",           bg: () => '#C8E6D8',                                  color: '#2B471E' },
  entressafra:  { labelLegenda: "Entressafra",       bg: () => '#E5DCC4',                                  color: '#6B6358' },
  a_confirmar:  { labelLegenda: "A confirmar",       bg: () => null,                                       color: '#6B6358' }
};

const MES_ATUAL = new Date().getMonth();

function calCellStyle(fruta, m) {
  const meta = CAL_STATUS_META[m.status];
  if (!meta) return 'background:#eee';
  const bg = meta.bg(fruta);
  return bg ? `background:${bg}` : '';
}

function buildCalendario() {
  const meses = FRUTAS[0].meses.map(m => m.mes);

  const headerRow = `
    <tr>
      <th style="width:130px"></th>
      ${meses.map((m,i) => `<th class="cal-th-mes${i===MES_ATUAL?' current':''}">${m}</th>`).join('')}
    </tr>`;

  const fruitRows = FRUTAS.map(f => `
    <tr>
      <td class="cal-th-fruta" onclick="calShow('detail','${f.id}')">
        <span class="cal-dot" style="background:${f.cor}"></span>${f.nome}
      </td>
      ${f.meses.map((m,i) => `
        <td class="${i===MES_ATUAL?'cal-col-current':''}">
          <div class="cal-cell ${m.status==='a_confirmar'?'cal-cell-confirm':''}"
               title="${f.nome} · ${m.mes}: ${m.label}"
               style="${calCellStyle(f,m)}"
               onclick="calShow('detail','${f.id}')"></div>
        </td>`).join('')}
    </tr>`).join('');

  const legendItems = [
    { swatch: 'background:var(--arbusto)',                                                                 text: 'Safra plena / pico' },
    { swatch: 'background:var(--arbusto);opacity:.5',                                                      text: 'Início ou fim de safra' },
    { swatch: 'background:#C8E6D8',                                                                        text: 'Plantio' },
    { swatch: 'background:#E5DCC4',                                                                        text: 'Entressafra' },
    { swatch: 'background:repeating-linear-gradient(45deg,#E5DCC4 0 4px,#F1E9D2 4px 8px)',                 text: 'A confirmar' }
  ].map(l => `<div class="cal-legend-item"><span class="cal-legend-swatch" style="${l.swatch}"></span>${l.text}</div>`).join('');

  const overview = `
    <div class="cal-view active" id="cal-overview">
      <div class="cal-intro">Visão anual da disponibilidade de frutas. Clique em uma fruta ou em qualquer célula para abrir a ficha detalhada.</div>
      <div class="cal-scroll-wrap">
      <div class="cal-grid">
        <table class="cal-table">
          <thead>${headerRow}</thead>
          <tbody>${fruitRows}</tbody>
        </table>
      </div>
      </div>
      <div class="cal-legend">${legendItems}</div>
    </div>`;

  const details = FRUTAS.map(f => {
    const tabs = FRUTAS.map(other => `
      <button class="cal-frutas-tab${other.id===f.id?' active':''}" onclick="calShow('detail','${other.id}')">
        <span class="cal-dot" style="background:${other.cor}"></span>${other.nome}
      </button>`).join('');

    const cards = f.meses.map((m,i) => {
      const bg = CAL_STATUS_META[m.status].bg(f);
      const labelStyle = bg
        ? `background:${bg};color:${CAL_STATUS_META[m.status].color}`
        : `background:var(--cl);color:var(--gy)`;
      const barStyle = bg ? `background:${bg}` : '';
      return `
        <div class="cal-mes-card ${i===MES_ATUAL?'current':''} ${m.status==='a_confirmar'?'confirm':''}">
          <div class="cal-status-bar" style="${barStyle}"></div>
          <div class="cal-mes-hd">
            <div class="cal-mes-nome">${m.mes}${i===MES_ATUAL?'<span class="cur-tag">mês atual</span>':''}</div>
            <span class="cal-mes-label" style="${labelStyle}">${m.label}</span>
          </div>
          <div class="cal-mes-preco ${m.preco?'':'muted'}">${m.preco ? 'Preço: ' + m.preco : 'Preço a definir'}</div>
          <div class="cal-mes-nota">${esc(m.nota)}</div>
        </div>`;
    }).join('');

    return `
      <div class="cal-view" id="cal-detail-${f.id}">
        <button class="cal-back" onclick="calShow('overview')">← Voltar ao calendário</button>
        <div class="cal-detail-hd">
          <div class="cal-detail-bullet" style="background:${f.cor}"></div>
          <div class="cal-detail-meta">
            <h2>${f.nome}</h2>
            <p>${esc(f.descricao)}</p>
          </div>
        </div>
        <div class="cal-frutas-tabs">${tabs}</div>
        <div class="cal-meses">${cards}</div>
      </div>`;
  }).join('');

  return `
    <div class="stage" id="stage-calendario">
      <div class="stage-hd">
        <div class="stage-title"><span class="stage-ico">📅</span>Calendário de frutas</div>
        <div class="stage-desc">Quando cada fruta está disponível ao longo do ano. Cores indicam o estágio: safra plena, início ou fim, plantio, entressafra.</div>
      </div>
      ${overview}
      ${details}
    </div>`;
}

function calShow(view, fruitId) {
  document.querySelectorAll('#stage-calendario .cal-view').forEach(v => v.classList.remove('active'));
  if (view === 'overview') {
    document.getElementById('cal-overview').classList.add('active');
  } else {
    const el = document.getElementById('cal-detail-' + fruitId);
    if (el) el.classList.add('active');
  }
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

// =============================================================

const NAV = [
  { t: 'lbl', text: 'Fluxo do cliente' },
  { t: 'stage', key: 'primeiroContato' },
  { t: 'fixed', id: 'superfruta', num: '2', nav: 'Apresentação da superfruta', icon: '🫐' },
  { t: 'stage', key: 'envioCatalogo' },
  { t: 'stage', key: 'followupLink' },
  { t: 'stage', key: 'confirmacao' },
  { t: 'stage', key: 'agradecimento' },
  { t: 'stage', key: 'entrega' },
  { t: 'stage', key: 'posEntrega' },
  { t: 'stage', key: 'reativacao' },
  { t: 'stage', key: 'leadFrio' },
  { t: 'stage', key: 'problema' },
  { t: 'div' },
  { t: 'lbl', text: 'Referência rápida' },
  { t: 'fixed', id: 'calendario', nav: 'Calendário de frutas', icon: '📅' },
  { t: 'fixed', id: 'regras', nav: 'Regras operacionais', icon: '📋' },
  { t: 'fixed', id: 'expansao', nav: 'Fluxos futuros', icon: '🔮' }
];

let curStage = 'primeiro-contato';

function esc(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function fmt(text) {
  return esc(text)
    .replace(/\[([^\]]+)\]/g, '<span class="var" contenteditable="true" spellcheck="false">[$1]</span>')
    .replace(/\n/g, '<br>');
}

function copyIcon() {
  return '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>';
}
function checkIcon() {
  return '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>';
}

function msgCard(m) {
  const bc = m.type === 'out' ? 'bubble-out' : 'bubble-in';
  return `
    <div class="msg-card">
      <div class="chat-bg">
        <div class="bubble ${bc}" id="${m.id}">${fmt(m.text)}</div>
      </div>
      <div class="card-foot">
        <span class="card-note">${m.note || ''}</span>
        <button class="copy-btn" onclick="cp('${m.id}',this)">${copyIcon()} Copiar</button>
      </div>
    </div>`;
}

function groups(gs) {
  return gs.map(g => `
    <div class="group">
      <div class="grp-lbl">${g.label}</div>
      ${g.msgs.map(msgCard).join('')}
    </div>`).join('');
}

function buildStage(d) {
  const body = d.tabs
    ? `<div class="react-tabs">${d.tabs.map((t,i) => `<button class="react-tab${i===0?' active':''}" onclick="switchTab('${t.id}',this)">${t.label} <small>${t.sub}</small></button>`).join('')}</div>
       ${d.tabs.map((t,i) => `<div class="react-panel${i===0?' active':''}" id="${t.id}">${groups(t.groups)}</div>`).join('')}`
    : groups(d.groups);

  return `
    <div class="stage" id="stage-${d.id}">
      <div class="stage-hd">
        <div class="stage-title"><span class="stage-num">${d.num}.</span><span class="stage-ico">${d.icon}</span>${d.title}</div>
        <div class="stage-desc">${d.desc}</div>
      </div>
      <div class="var-hint">✏️ <span>Clique nas variáveis destacadas para editá-las antes de copiar</span></div>
      ${body}
    </div>`;
}

function buildSuperfruta() {
  const cards = SCRIPTS.triggers.map(t => `
    <button class="trig-card" id="tc-${t.id}" onclick="selTrig('${t.id}')">
      <span class="tc-ico">${t.icon}</span>
      <div class="tc-title">${t.title}</div>
    </button>`).join('');

  return `
    <div class="stage" id="stage-superfruta">
      <div class="stage-hd">
        <div class="stage-title"><span class="stage-num">2.</span><span class="stage-ico">🫐</span>Apresentação da superfruta</div>
        <div class="stage-desc">Usar apenas para clientes que não conhecem o produto. Selecione o gatilho mais adequado ao perfil da conversa.</div>
      </div>
      <div class="trig-intro"><strong>Regra:</strong> use apenas um gatilho por conversa. Escolha conforme o perfil detectado.</div>
      <div class="trig-grid">${cards}</div>
      <div class="trig-result" id="trig-result">
        <div class="trig-when" id="trig-when"></div>
        <div class="msg-card">
          <div class="chat-bg">
            <div class="bubble bubble-out" id="trig-bubble"></div>
          </div>
          <div class="card-foot">
            <span class="card-note"></span>
            <button class="copy-btn" onclick="cp('trig-bubble',this)">${copyIcon()} Copiar</button>
          </div>
        </div>
      </div>
    </div>`;
}

function buildRegras() {
  return `
    <div class="stage" id="stage-regras">
      <div class="stage-hd">
        <div class="stage-title"><span class="stage-ico">📋</span>Regras operacionais</div>
        <div class="stage-desc">Diretrizes de comportamento para todo o atendimento Inatú via WhatsApp.</div>
      </div>
      <div class="rules-grid">${SCRIPTS.rules.map(r=>`<div class="rule-item">${r.icon} ${r.text}</div>`).join('')}</div>
    </div>`;
}

function buildExpansao() {
  const items = SCRIPTS.futureFlows.map(f => `
    <div class="exp-item">
      <span class="exp-badge">Em breve</span>
      <strong>${f.title}</strong>
      <div class="exp-sub">${f.sub}</div>
      ${f.desc}
    </div>`).join('');
  return `
    <div class="stage" id="stage-expansao">
      <div class="stage-hd">
        <div class="stage-title"><span class="stage-ico">🔮</span>Fluxos futuros</div>
        <div class="stage-desc">Seções reservadas para novos scripts. Preencher nas próximas sessões conforme os fluxos forem definidos.</div>
      </div>
      <div class="exp-grid">${items}</div>
    </div>`;
}

function buildNav() {
  const nav = document.getElementById('sb-nav');
  nav.innerHTML = NAV.map(item => {
    if (item.t === 'lbl') return `<div class="nav-lbl">${item.text}</div>`;
    if (item.t === 'div') return `<div class="nav-div"></div>`;
    let id, num, navTxt, icon;
    if (item.t === 'stage') {
      const s = SCRIPTS[item.key];
      id = s.id; num = s.num; navTxt = s.nav; icon = s.icon;
    } else {
      id = item.id; num = item.num; navTxt = item.nav; icon = item.icon;
    }
    const badge = num
      ? `<span class="nav-num">${num}</span>`
      : `<span class="nav-ico">${icon}</span>`;
    const active = id === curStage ? ' active' : '';
    return `<button class="nav-btn${active}" id="nav-${id}" onclick="show('${id}')">${badge}<span>${navTxt}</span></button>`;
  }).join('');
}

function buildContent() {
  const stageKeys = ['primeiroContato','envioCatalogo','followupLink','confirmacao','agradecimento','entrega','posEntrega','reativacao','leadFrio','problema'];
  document.getElementById('content').innerHTML =
    stageKeys.map(k => buildStage(SCRIPTS[k])).join('') +
    buildSuperfruta() + buildCalendario() + buildRegras() + buildExpansao();
}

function show(id) {
  document.querySelectorAll('.stage').forEach(s => s.classList.remove('active'));
  const s = document.getElementById('stage-' + id);
  if (s) s.classList.add('active');
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  const b = document.getElementById('nav-' + id);
  if (b) b.classList.add('active');
  curStage = id;
  if (id === 'calendario') calShow('overview');
  closeSB();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function switchTab(tabId, btn) {
  const stage = btn.closest('.stage');
  stage.querySelectorAll('.react-tab').forEach(t => t.classList.remove('active'));
  btn.classList.add('active');
  stage.querySelectorAll('.react-panel').forEach(p => p.classList.remove('active'));
  document.getElementById(tabId).classList.add('active');
}

function selTrig(id) {
  document.querySelectorAll('.trig-card').forEach(c => c.classList.remove('sel'));
  document.getElementById('tc-' + id).classList.add('sel');
  const t = SCRIPTS.triggers.find(x => x.id === id);
  if (!t) return;
  document.getElementById('trig-when').innerHTML = `<strong>Quando usar:</strong> ${esc(t.when)}`;
  document.getElementById('trig-bubble').innerHTML = fmt(t.text);
  document.getElementById('trig-result').classList.add('show');
}

function cp(id, btn) {
  const el = document.getElementById(id);
  if (!el) return;
  const text = el.innerText;
  const origHTML = btn.innerHTML;
  const done = () => {
    toast('Mensagem copiada');
    btn.innerHTML = checkIcon() + ' Copiado';
    btn.classList.add('ok');
    setTimeout(() => { btn.innerHTML = origHTML; btn.classList.remove('ok'); }, 2000);
  };
  if (navigator.clipboard) {
    navigator.clipboard.writeText(text).then(done).catch(() => fallbackCopy(el, done));
  } else {
    fallbackCopy(el, done);
  }
}

function fallbackCopy(el, cb) {
  const r = document.createRange();
  r.selectNodeContents(el);
  const sel = window.getSelection();
  sel.removeAllRanges(); sel.addRange(r);
  try { document.execCommand('copy'); cb(); } catch(e) {}
  sel.removeAllRanges();
}

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('on');
  setTimeout(() => t.classList.remove('on'), 2200);
}

function toggleSB() {
  document.getElementById('sidebar').classList.toggle('open');
  document.getElementById('overlay').classList.toggle('on');
}
function closeSB() {
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('overlay').classList.remove('on');
}

// Init
buildNav();
buildContent();
show(curStage);
</script>
